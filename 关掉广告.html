<body>
<a class="skip-link" href="#game-controls">跳到操作菜单</a>
<div id="app"></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script>(()=>{'use strict';
const STAGE_COUNT=6;
function initialState(){
  return {
    stage:0,screen:'menu',hasStarted:false,returnScreen:'play',adClosed:[],adOverlays:[],sponsorId:null,attention:100,mistakes:0,recoveries:0,inspected:[],completed:[],
    layers:['prize'],route:'goal',history:[],tabClosed:false,paused:false,
    recipeExpanded:false,timetableOpen:false,saved:false,permissionSimulated:false,
    extras:{insurance:true,fast:true,trial:true},reviewed:false,cookie:true,
    lessonOpened:false,pushAllowed:true,pushQueue:[0,1,2],pushSettings:false,messageOpen:false,messageRead:false,
    cancelStep:'account',subscription:{status:'active',renewal:true,nextCharge:'2026-11-06',price:19},
    notice:'先记住你要做的事。这里没有倒计时，慢慢来。'
  };
}
function total(s){return 48+(s.extras.insurance?12:0)+(s.extras.fast?18:0);}
function stageAdIds(stage){const prefix={2:'ticket',3:'lesson',4:'inbox',5:'radio'}[stage];return prefix?['banner','image','float','followup'].map(slot=>`${prefix}-${slot}`):[];}
function enterStage(s,stage){return {...initialState(),stage,screen:'play',hasStarted:true,attention:s.attention,mistakes:s.mistakes,recoveries:s.recoveries,inspected:[...s.inspected],completed:[...s.completed],layers:stage===0?['prize']:[],adOverlays:stageAdIds(stage).filter(id=>id.endsWith('-float')),notice:stageNotices[stage]};}
const mistake=(s,notice,patch={})=>({...s,...patch,mistakes:s.mistakes+1,attention:Math.max(15,s.attention-8),notice});
const finish=(s)=>({...s,screen:'debrief',layers:[],completed:[...new Set([...s.completed,s.stage])],notice:'原来的任务，完成了。'});
const enterDetour=(s,route,notice)=>mistake(s,notice,{route,history:[...s.history,s.route],layers:[]});
const stageNotices=[
  '先记住你要做的事。这里没有倒计时，慢慢来。',
  '这次，你只想要一份课表。',
  '买一张票，别买成一种生活方式。',
  '播放键长得都差不多，它们要带你去的地方可不同。',
  '这一次，通知权限已经开了。关掉一条消息，能让它们停下来吗？',
  '最后一件小事：让一份不再需要的订阅，真正停下来。'
];
function reduce(s,a){
  if(a.type==='restart')return initialState();
  if(a.type==='stage.select')return Number.isInteger(a.value)&&a.value>=0&&a.value<STAGE_COUNT?enterStage(s,a.value):s;
  if(a.type==='menu.open')return s.screen==='menu'?s:{...s,screen:'menu',returnScreen:s.screen,paused:false};
  if(a.type==='menu.resume')return s.screen==='menu'&&s.hasStarted?{...s,screen:s.returnScreen,paused:false}:s;
  if(a.type==='retry')return s.hasStarted?enterStage(s,s.stage):s;
  if(a.type==='resume')return {...s,paused:false};
  if(s.paused)return s;
  if(a.type==='pause')return {...s,paused:true};
  if(a.type==='inspect')return {...s,inspected:[...new Set([...s.inspected,a.value])]};
  if(a.type==='next'&&s.screen==='debrief'){
    if(s.completed.length===STAGE_COUNT)return {...s,screen:'complete',notice:'六件小事都完成了。今天的决定权，回到你手里。'};
    if(s.stage===STAGE_COUNT-1)return {...s,screen:'menu',returnScreen:'debrief',notice:'这关完成了。还可以去看看其他的小事。'};
    return enterStage(s,s.stage+1);
  }
  if(s.screen!=='play')return s;
  if(a.type==='browser.return'||a.type==='browser.back')return {
    ...s,layers:[],adOverlays:[],route:a.type==='browser.back'?(s.history.at(-1)||'goal'):'goal',
    history:a.type==='browser.back'?s.history.slice(0,-1):[],tabClosed:false,timetableOpen:false,
    permissionSimulated:false,pushSettings:false,messageOpen:false,
    cancelStep:s.subscription.status==='cancelled'?'receipt':'account',recoveries:s.recoveries+1,
    notice:s.stage===4?'已回到消息中心。单独关掉页面不会撤回已经开启的通知权限。':'回到原来的任务。已经确认的选择仍然有效，误点也能重新决定。'
  };
  if(a.type==='browser.close')return {...s,tabClosed:true,layers:[],adOverlays:[],notice:'标签页已关闭。用「返回原页面」重新打开原页。'};
  if(s.tabClosed||s.route!=='goal')return s;
  if(a.type.startsWith('ad.')){
    const valid=stageAdIds(s.stage);
    if(!valid.includes(a.value)||s.adClosed.includes(a.value))return s;
    const floating=a.value.endsWith('-float')||a.value.endsWith('-followup');
    if(floating&&!s.adOverlays.includes(a.value))return s;
    if(a.type==='ad.close')return {...s,adClosed:[...s.adClosed,a.value],adOverlays:s.adOverlays.filter(id=>id!==a.value),notice:'这一条广告已经关闭。'};
    if(a.type==='ad.fakeclose'&&a.value.endsWith('-float')){
      const extra=a.value.replace('-float','-followup');
      return mistake(s,'这个 × 又带来一张推广卡片。你仍可以关闭它，或返回原页面。',{adOverlays:[...new Set([...s.adOverlays,...(s.adClosed.includes(extra)?[]:[extra])])].slice(0,2)});
    }
    if(a.type==='ad.visit')return enterDetour({...s,sponsorId:a.value},'sponsor','打开了推广页面。原来的事情还在那里，可以随时返回。');
    return s;
  }
  if(s.stage===0){
    if(a.type==='notice.dismiss')return {...s,cookie:false,notice:'普通的页面提示可以关闭；判断来源和影响，比一概拒绝更有用。'};
    if(a.type==='trap.close')return mistake(s,'感谢关闭，我们已为您打开更贴心的一条。这个 × 是广告入口。',{layers:['prize','security']});
    if(a.type==='trap.prize')return enterDetour(s,'prize','奖品还没到，任务已经跑偏了。你可以使用上方的返回。');
    if(a.type==='trap.security')return enterDetour(s,'security','网页里的扫描动画不是系统检测。别被一条警告带走。');
    if(a.type==='recipe.expand')return {...s,recipeExpanded:true,notice:'找到了原始做法。记下第 3 步的烤箱温度。'};
    if(a.type==='recipe.answer'){
      if(!s.recipeExpanded)return {...s,notice:'先打开原始菜谱的做法，核对一下，别靠猜。'};
      return Number(a.value)===200?finish(s):mistake(s,'这个温度和原始菜谱不一致。再看第 3 步，可以重新填写。');
    }
  }
  if(s.stage===1){
    if(a.type==='trap.download')return enterDetour(s,'download','“高速下载”送来的不是课表，而是一个安装器。');
    if(a.type==='trap.permission')return mistake(s,'通知开启了；这不是拿到课表的必要条件。回到任务即可撤回。',{permissionSimulated:true,layers:['notification']});
    if(a.type==='pdf.open')return {...s,timetableOpen:true,notice:'核对文件名、发布者与学期，再保存到文件夹。'};
    if(a.type==='pdf.old')return {...s,notice:'这份是 2025 秋季旧版。任务需要 2026 秋季，继续找当前版本。'};
    if(a.type==='pdf.save'&&s.timetableOpen)return finish({...s,saved:true});
  }
  if(s.stage===2){
    if(a.type==='extra'&&Object.hasOwn(s.extras,a.value))return {...s,extras:{...s.extras,[a.value]:!s.extras[a.value]},reviewed:false,notice:'订单已更新。付款前再核对一次合计和后续费用。'};
    if(a.type==='trap.keep')return mistake(s,'“保留免费权益”保留的，也包括 7 天后的自动续费。',{extras:{...s.extras,trial:true},reviewed:false});
    if(a.type==='trial.cancel')return {...s,extras:{...s.extras,trial:false},reviewed:false,notice:'已移除试用会员与自动续费。普通门票仍然可以购买。'};
    if(a.type==='checkout.review')return {...s,reviewed:true,notice:'请核对本次金额、后续扣费，以及退改规则。确认后再提交订单。'};
    if(a.type==='checkout.pay'){
      if(!s.reviewed)return {...s,notice:'先展开订单核对，看看最后要付多少。'};
      if(total(s)>50)return mistake(s,'超出 ¥50 预算。移除不需要的附加项后，再次核对订单。');
      if(s.extras.trial)return mistake(s,'本次 ¥48，但 7 天后会自动续费 ¥39/月。先移除试用会员。');
      return finish(s);
    }
  }
  if(s.stage===3){
    if(a.type==='trap.play')return enterDetour(s,'video-ad','这个播放键属于推广卡片，打开的是广告，而不是薄荷修剪课。');
    if(a.type==='trap.update')return enterDetour(s,'update','播放课程无需更新插件。这是播放器更新诱导。');
    if(a.type==='trap.videoDownload')return enterDetour(s,'video-download','拿到的是“万能播放助手”。原课程可以直接在本页阅读。');
    if(a.type==='lesson.play')return {...s,lessonOpened:true,notice:'已打开原课程。三幅分镜和完整文字都在这里，不需要等播放结束。'};
    if(a.type==='lesson.answer'){
      if(!s.lessonOpened)return {...s,notice:'先打开原课程，核对老师的修剪要点。'};
      return a.value==='node'?finish(s):mistake(s,'再看看第 2 幅分镜：在一对叶子的叶节上方剪，保留下面的叶片。');
    }
  }
  if(s.stage===4){
    if(a.type==='notifications.settings')return {...s,pushSettings:!s.pushSettings,notice:'查看这个来源是否被允许发送通知，再决定是否保留。'};
    if(a.type==='notifications.block'&&s.pushSettings)return {...s,pushAllowed:false,pushQueue:[],notice:'已禁止「好运速报」发送通知。阅览室的有用消息仍然保留。'};
    if(a.type==='notifications.dismiss')return {...s,pushQueue:s.pushQueue.filter(id=>id!==Number(a.value)),notice:s.pushAllowed?'这一条关掉了，但来源仍有权限。可以检查权限设置。':'这一条已关闭。被禁止的来源不会再次补入通知。'};
    if(a.type==='notifications.refresh')return {...s,pushQueue:s.pushAllowed?[0,1,2]:[],notice:s.pushAllowed?'又来了三条。关消息只清理当前列表，没有撤销来源的权限。':'没有新增推广通知。现在可以安静地核对阅览室消息。'};
    if(a.type==='message.open')return {...s,messageOpen:true,notice:'找到阅览室的取书消息了。核对地点和时间，再记下它。'};
    if(a.type==='message.ack'){
      if(!s.messageOpen)return {...s,notice:'先打开阅览室的原始消息。'};
      if(s.pushAllowed)return {...s,messageRead:true,notice:'消息记下了，但「好运速报」仍可发送通知。先撤回这个无关来源的权限。'};
      return finish({...s,messageRead:true});
    }
  }
  if(s.stage===5){
    if(a.type==='subscription.manage')return {...s,cancelStep:s.subscription.status==='cancelled'?'receipt':'manage',notice:'订阅管理里列出了当前状态、下次扣费和取消入口。'};
    if(a.type==='cancellation.start'&&s.cancelStep==='manage'&&s.subscription.status!=='cancelled')return {...s,cancelStep:'offers',notice:'接下来会出现挽留方案。先看每个选项是否真的停止续费。'};
    if(s.cancelStep==='offers'){
      if(a.type==='trap.discount')return mistake(s,'优惠已经应用，但订阅还在，下次仍会扣费。可以重新进入管理并取消。',{cancelStep:'account',subscription:{status:'discounted',renewal:true,nextCharge:'2026-11-06',price:9}});
      if(a.type==='trap.pause')return mistake(s,'暂停只延后扣费：2026-12-06 会恢复 ¥19/月。它还没有被取消。',{cancelStep:'account',subscription:{status:'paused',renewal:true,nextCharge:'2026-12-06',price:19}});
      if(a.type==='cancellation.continue')return {...s,cancelStep:'review',notice:'你还没取消。请核对下面的最终确认说明。'};
    }
    if(a.type==='cancellation.confirm'&&s.cancelStep==='review')return {...s,cancelStep:'receipt',subscription:{...s.subscription,status:'cancelled',renewal:false,nextCharge:null},notice:'取消已生效。最后核对回执中的订阅状态和下次扣费。'};
    if(a.type==='cancellation.verify'){
      if(s.cancelStep==='receipt'&&s.subscription.status==='cancelled'&&!s.subscription.renewal&&s.subscription.nextCharge===null)return finish(s);
      return {...s,notice:'还没有有效的取消回执。优惠、暂停和“正在办理”都不代表取消完成。'};
    }
  }
  return s;
}

// Restore exact controls across whole-view rerenders. Action names are not identities.
function captureFocus(element){return element?.dataset?.focus||null;}
function restoreFocus(root,identity,fallbacks=[]){
  for(const key of [...new Set([identity,...fallbacks].filter(Boolean))]){
    // Identifiers are authored locally, never derived from user input.
    const element=root.querySelector(`[data-focus="${key}"]`);
    if(element&&!element.disabled&&!element.hidden&&element.getClientRects().length){
      element.focus({preventScroll:true});
      return true;
    }
  }
  return false;
}

function focusFallbacks(){return state.screen==='menu'?['menu:resume','chapter:0','menu']:['toolbar:inspect','toolbar:return','world'];}
function render(preferredFocus=null,resetInput=false){
 const key=preferredFocus||actionFocus||captureFocus(document.activeElement);actionFocus=null;
 const scroll=document.getElementById('world')?.scrollTop||0,input=document.getElementById('temperature');
 if(resetInput)temperatureDraft='';else if(input)temperatureDraft=input.value;

 if(key)restoreFocus(app,key,focusFallbacks());
 const world=document.getElementById('world');if(world)world.scrollTop=scroll;
 document.getElementById('announcer').textContent=state.notice;
}
function dispatch(type,value){
 const oldStage=state.stage,oldScreen=state.screen;
 state=reduce(state,{type,value});render(null,['restart','retry','stage.select'].includes(type));
 if(oldStage!==state.stage||oldScreen!==state.screen){
  const target=state.screen==='menu'?document.querySelector('.chapter-menu'):document.getElementById('world');
  if(target){target.scrollTop=0;target.focus({preventScroll:true});}
  document.querySelector(state.screen==='menu'?'.chapter-menu':'.browser')?.scrollIntoView({block:'start',behavior:'instant'});
 }
}
function openDialog(type,html){

 if(dialog.open)dialog.close();
 dialogType=type;dialog.innerHTML=html;dialog.showModal();document.documentElement.dataset.paused='true';
}
function closeDialog(){
 dialog.close();if(state.paused)state=reduce(state,{type:'resume'});
 dialogType='';const returnTo=dialogReturn;dialogReturn=null;render(returnTo);

function inspect(key){const info=inspections[key];if(!info)return;state=reduce(state,{type:'inspect',value:key});openDialog('inspect',`<div class="dialog-top"><span class="eyebrow">INSPECT BEFORE YOU CLICK</span>${button('dialog.close','×','dialog-x','aria-label="关闭检查面板"','dialog:inspect-x')}</div><span class="inspector-kind">${info.kind}</span><h2 id="dialog-title">${info.title}</h2><dl class="inspect-facts"><dt>谁提供的</dt><dd>${info.source}</dd><dt>指向哪里</dt><dd>${info.target}</dd><dt>点了会怎样</dt><dd>${info.effect}</dd></dl><div class="inspect-clue">${info.clue}</div><p class="inspect-safety">刚才只做了检查，没有触发这个控件。</p>${button('dialog.close','看清了，回去决定 →','solid')}`);}

 if(action==='browser.menu'){openDialog('browser-menu',`<div class="dialog-top"><span class="eyebrow">BROWSER MENU</span>${button('dialog.close','×','dialog-x','aria-label="关闭菜单"','dialog:menu-x')}</div><h2 id="dialog-title">停一下，也没关系。</h2><div class="browser-menu-actions">${button('goal.show','★ 本关目标','menu-item')}${button('pause','Ⅱ 暂停','menu-item')}${button('retry','↺ 重试本关','menu-item')}${button('motion',reduceMotion?'◐ 动态已减少':'◐ 减少动态','menu-item',`aria-pressed="${reduceMotion}"`)}${button('help','? 玩法提示','menu-item')}${button('menu.open','⌂ 返回选关','menu-item')}</div>`);return;}

 if(action==='inspect.toggle'){inspectMode=!inspectMode;render();return;}
 if(action==='motion'){reduceMotion=!reduceMotion;document.documentElement.dataset.reduced=String(reduceMotion);render();if(dialogType==='browser-menu'){dialog.close();handleAction('browser.menu');}return;}

 if(action==='restart'){if(dialog.open)dialog.close();openDialog('restart',`<span class="eyebrow">A FRESH START</span><h2 id="dialog-title">清空本次进度？</h2><p>六关的完成记录与当前进度都会清空。</p><div class="dialog-actions">${button('restart.confirm','清空并回到选关','solid')}${button('dialog.close','继续当前游戏','text-button')}</div>`);return;}
 if(action==='restart.confirm'){dialog.close();dialogType='';inspectMode=false;dispatch('restart');return;}
 if(action==='help'){openDialog('help',`<div class="dialog-top"><span class="eyebrow">PLAY AT YOUR OWN PACE</span>${button('dialog.close','×','dialog-x','aria-label="关闭说明"','dialog:help-x')}</div><h2 id="dialog-title">完成任务，才算赢。</h2><ul class="help-list"><li>从选关页任选一件小事开始。浏览器书签栏显示本关目标，点击可查看完整说明。</li><li>点击浏览器工具栏的「检查」，再点页面里的控件，先看来源和点击后果。</li><li>点错可以用浏览器里的「返回」或「返回原页面」恢复，也可以关闭当前标签页。</li><li>浏览器菜单包含暂停、重试与减少动态。Tab 选择控件，Enter/空格操作，Esc 关闭说明或暂停。</li><li>没有时间惩罚。完整体验约 10–15 分钟，也可以慢慢玩。</li></ul>${button('dialog.close','知道了，继续 →','solid')}`);return;}
 if(action==='sources'){openDialog('sources',`<div class="dialog-top"><span class="eyebrow">READ THE SMALL PRINT</span>${button('dialog.close','×','dialog-x','aria-label="关闭资料"','dialog:sources-x')}</div><h2 id="dialog-title">一点现实依据。</h2><p>本游戏聚焦欺骗性广告、恐吓式广告和暗黑模式；不是所有广告、通知或限时活动都有问题。</p><ul class="source-list">${sources.map(([title,url])=>`<li><b>${title}</b><span>${url}</span></li>`).join('')}</ul><p class="inspect-safety">网址仅作资料标注，不会在游戏中打开外部页面。</p>${button('dialog.close','回到小结','solid')}`);return;}
 if(inspectMode&&el?.dataset.inspect){inspect(el.dataset.inspect);return;}
 if(action.startsWith('ad.')){const [,kind,id]=action.split('.');dispatch(`ad.${kind}`,id);return;}
 if(action.startsWith('lesson.answer.')){dispatch('lesson.answer',action.split('.').at(-1));return;}
 if(action.startsWith('notifications.dismiss.')){dispatch('notifications.dismiss',Number(action.split('.').at(-1)));return;}
 if(action==='recipe.submit'){const input=document.getElementById('temperature');if(!input.checkValidity()){input.reportValidity();return;}dispatch('recipe.answer',input.value);return;}
 if(action==='trial.remove'){openDialog('trial',`<span class="eyebrow">ONE LAST CHANCE, THEY SAID.</span><h2 id="dialog-title">真的要放弃免费权益吗？</h2><p>点击「保留免费权益」将继续试用，并在 7 天后自动续费 ¥39/月。</p><div class="retention-card"><span>只买一张门票也没关系。</span><b>普通门票 ¥48 仍可正常购买</b></div>${button('trap.keep','保留免费权益','retention-button')}${button('trial.cancel','继续放弃 · 移除自动续费','cancel-trial')}`);return;}
 if(action==='trap.keep'||action==='trial.cancel'){dialog.close();dialogType='';dispatch(action);return;}
 if(action==='trial.add'){dispatch('extra','trial');return;}
 dispatch(action);
}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b){event.preventDefault();handleAction(b.dataset.action,b);return;}const label=event.target.closest('.extra-row');if(label&&inspectMode){event.preventDefault();const input=label.querySelector('input');actionFocus=captureFocus(input);inspect(input.dataset.inspect);}});
document.addEventListener('change',event=>{const key=event.target.dataset.extra;if(key){if(inspectMode){event.target.checked=state.extras[key];actionFocus=captureFocus(event.target);inspect(event.target.dataset.inspect);}else dispatch('extra',key);}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='temperature-form')handleAction('recipe.submit',event.target.querySelector('[data-action="recipe.submit"]'));});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!dialog.open&&state.screen!=='menu'){event.preventDefault();handleAction('pause');}});
dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
render();

})();</script>
</body>
